name: Fetch Medium articles

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Medium RSS and convert to JSON
        run: |
          curl -s "https://medium.com/feed/@navilasm" \
            -H "User-Agent: Mozilla/5.0" > feed.xml

          python3 - <<'EOF'
          import xml.etree.ElementTree as ET

          tree = ET.parse('feed.xml')
          root = tree.getroot()

          # print raw XML of first item so we can see the structure
          first = root.find('./channel/item')
          if first is not None:
              for child in first:
                  print(f"TAG: {child.tag}")
                  print(f"TEXT: {child.text[:300] if child.text else 'None'}")
                  print("---")
          EOF

      - name: Commit medium.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add medium.json
          git diff --cached --quiet || git commit -m "chore: refresh Medium articles"
          git push
